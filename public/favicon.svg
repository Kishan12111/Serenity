<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Timer ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#accent)" stroke-width="2" 
          stroke-dasharray="55 69" stroke-linecap="round" transform="rotate(-90 16 16)"/>
  
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20" y2="13" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center -->
  <circle cx="16" cy="16" r="2" fill="url(#accent)"/>
  
  <!-- Stars -->
  <circle cx="26" cy="6" r="1.5" fill="#fbbf24"/>
  <circle cx="6" cy="8" r="1" fill="#fbbf24"/>
</svg>
