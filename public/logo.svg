<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#timerGrad)" stroke-width="12" opacity="0.3"/>
  
  <!-- Progress arc (decorative) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#timerGrad)" stroke-width="12" 
          stroke-dasharray="1100 1382" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="180" fill="#1a1a2e" opacity="0.5"/>
  
  <!-- Sparkle/star decorations -->
  <g fill="url(#starGrad)">
    <circle cx="380" cy="120" r="8"/>
    <circle cx="420" cy="180" r="5"/>
    <circle cx="100" cy="150" r="6"/>
    <circle cx="130" cy="380" r="7"/>
    <circle cx="400" cy="350" r="4"/>
  </g>
  
  <!-- Timer icon in center -->
  <g transform="translate(256, 256)">
    <!-- Clock face -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
    
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="0" y2="-50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="35" y2="-35" stroke="url(#timerGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="10" fill="url(#timerGrad)"/>
  </g>
  
  <!-- Serenity text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
    SERENITY
  </text>
</svg>
