<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  
  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Main timer circle -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.2"/>
  
  <!-- Progress arc (focus indicator) -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5" 
          stroke-dasharray="42 57" stroke-linecap="round" transform="rotate(-90 16 16)"/>
  
  <!-- Inner circle -->
  <circle cx="16" cy="16" r="5" fill="url(#bg)" stroke="url(#accent)" stroke-width="0.5" opacity="0.8"/>
  
  <!-- Center S letter for Serinity -->
  <text x="16" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="url(#glow)">S</text>
  
  <!-- Sparkles -->
  <circle cx="26" cy="5" r="1.5" fill="#fbbf24"/>
  <circle cx="5" cy="7" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="27" cy="26" r="0.8" fill="#fbbf24" opacity="0.6"/>
</svg>
